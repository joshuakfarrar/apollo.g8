ui-url="http://localhost:8080"

# CSRF origin checking and cookie attributes. Keep these in sync with
# ui-url when deploying behind a real hostname.
csrf-host="localhost"
csrf-secure=false
csrf-port=8080

# Optional: pin the CSRF token-signing key so tokens survive restarts.
# Generate one with: mill webapp.runMain generateCsrfKey
# csrf-key="..."

# These match what db/initialize-database.sh (or .bat) creates when you
# accept its defaults, so a fresh checkout runs without editing this file.
sql-url="jdbc:postgresql://localhost:5432/$name$"
sql-username="$name$"
sql-password="$name$"

# Uncomment to send real e-mail through Mailgun. While these are unset,
# confirmation and password-reset e-mails are printed to the server
# console instead.
# mailgun-domain="mg.example.com"
# mailgun-key="key-..."
# mailgun-sender="noreply@example.com"
